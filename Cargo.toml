[package]
name = "agent-usage"
version = "0.1.0"
edition = "2021"
authors = ["Agent Usage contributors"]
description = "Multi-account usage dashboard for coding-agent billing providers"

[dependencies]
anstream = "1"
anstyle = "1"
base64 = "0.23"
clap = { version = "4.5", features = ["derive"] }
color-eyre = "0.6"
config = "0.15"
crossterm = { version = "0.29", features = ["event-stream"] }
eyre = "0.6"
fs2 = "0.4"
futures-util = "0.3"
platform-dirs = "0.3"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "crossterm_0_29", "layout-cache", "underline-color"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form"] }
rusqlite = { version = "0.38", features = ["bundled"] }
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
unicode-width = "0.2"
url = "2"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
allow_attributes_without_reason = "deny"
option_if_let_else = "deny"

[profile.release]
strip = true
